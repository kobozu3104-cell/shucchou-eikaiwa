<style>

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

const DIALOGS = {

  food: {role:'ハンバーガー店の店員', lines:[

// ===== スマホの中に保存する記録 =====
const KEY = 'shucchou-eikaiwa-v1';
const LEARN_TIMES = 3;
function emptyStore(){ return {progress:{}, custom:[], customScenes:[], hidden:[], edits:{}, memos:[], rate:0.9}; }
let store = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.progress) return Object.assign(emptyStore(), s); }catch(e){}
  return emptyStore();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ toast('保存できませんでした'); } }
function prog(id){ return store.progress[id] || (store.progress[id] = {m:0, learned:false, said:false, used:false}); }

function allScenes(){ return SCENES.concat(store.customScenes); }
function sceneOf(id){ return allScenes().find(s => s.id === id) || {id, name:'（場面なし）', emoji:'📝'}; }
function phrasesOf(sceneId){
  const base = PHRASES.filter(p => p.scene === sceneId && !store.hidden.includes(p.id))
                      .map(p => Object.assign({}, p, store.edits[p.id] || {}));
  return base.concat(store.custom.filter(p => p.scene === sceneId));
}
function findPhrase(id){
  const b = PHRASES.find(p => p.id === id);
  if(b) return Object.assign({}, b, store.edits[id] || {});
  return store.custom.find(p => p.id === id);
}

const $app = document.getElementById('app');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tag(lv){ const L = LEVELS[lv] || LEVELS.just; return `<span class="tag ${L.cls}">${L.label}</span>`; }
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function header(title, backTo){
  return `<div class="top">${backTo ? `<button class="back" onclick="${backTo}">‹ 戻る</button>` : ''}<h1>${esc(title)}</h1></div>`;
}

// ===== 読み上げ =====
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  const list = voices.filter(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase()));
  return list.find(v => /google/i.test(v.name)) || list[0] || null;
}
function speak(text, lang = 'en-US', rate){
  return new Promise(resolve => {
    if(!('speechSynthesis' in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate ?? (lang.startsWith('en') ? store.rate : 1);
    const v = pickVoice(lang.slice(0,2)); if(v) u.voice = v;
    let done = false; const fin = () => { if(!done){ done = true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 4000 + text.length * 200); // 終わりの合図が来ないときの保険
    speechSynthesis.speak(u);
  });
}
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

// ===== 聞き取り（発音チェック） =====
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(){
  return new Promise(resolve => {
    if(!Rec){ resolve({error:'unsupported'}); return; }
    if('speechSynthesis' in window) speechSynthesis.cancel();
    rec = new Rec();
    rec.lang = 'en-US'; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 5;
    let got = null;
    rec.onresult = e => { got = Array.from(e.results[0]).map(a => a.transcript); };
    rec.onerror = e => { if(!got) got = {error:e.error}; };
    rec.onend = () => { rec = null; resolve(Array.isArray(got) ? {alts:got} : (got || {error:'no-speech'})); };
    try{ rec.start(); }catch(e){ resolve({error:'start'}); }
  });
}
const NUM = {zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12'};
function words(s){
  return s.toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,'').replace(/'/g,'').replace(/[^a-z0-9\s]/g,' ')
          .split(/\s+/).filter(Boolean).map(w => NUM[w] || w);
}
function score(target, heard){
  const t = words(target), h = words(heard);
  if(!t.length) return 0;
  const pool = h.slice(); let hit = 0;
  t.forEach(w => { const i = pool.indexOf(w); if(i >= 0){ hit++; pool.splice(i,1); } });
  return hit / t.length;
}
function judge(target, res){
  if(res.error) return {ok:false, error:res.error};
  let best = {s:-1, text:''};
  res.alts.forEach(a => { const s = score(target, a); if(s > best.s) best = {s, text:a}; });
  return {ok: best.s >= 0.75, heard: best.text, s: best.s};
}
function errorText(code){
  return ({
    'unsupported':'この画面では聞き取りが使えません。AndroidのChromeで開いてください',
    'not-allowed':'マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください',
    'no-speech':'声が聞こえませんでした。もう一度どうぞ',
    'network':'インターネットにつながっていないため、聞き取りができません',
  })[code] || '聞き取りがうまくいきませんでした。もう一度どうぞ';
}
function resultHtml(j){
  if(j.error) return `<div class="ng">${esc(errorText(j.error))}</div>`;
  return j.ok
    ? `<div class="ok">◎ 聞き取れました</div><div class="sub">聞こえた言葉：${esc(j.heard)}</div>`
    : `<div class="ng">△ もう少し</div><div class="sub">聞こえた言葉：${esc(j.heard)}</div>`;
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}
async function toChatGPT(text){
  const ok = await copyText(text);
  toast(ok ? '質問の文をコピーしました。ChatGPTの入力欄に貼り付けて送ってください' : 'コピーできませんでした');
  setTimeout(() => window.open('https://chatgpt.com/?q=' + encodeURIComponent(text), '_blank'), 600);
}
function askPrompt(p){
  return `英会話の質問です。海外出張で「${p.en}」（${p.ja}）と言いたいです。\nこの言い方の丁寧さ、ほかの言い方、発音のコツを、英語初心者向けに日本語で短く教えてください。`;
}
const FORMAT = `英語：（英語の文）\n日本語：（日本語の意味）\n丁寧さ：（ちょうどいい丁寧さ／丁寧すぎる／くだけた言い方／教科書っぽい のどれか1つ）\nひとこと：（使うときのコツを20字くらいで）`;
function convertPrompt(text){
  return `次の日本語を、東南アジア出張（ホテル・タクシー・空港・お店）で使う、短い英語にしてください。\n「丁寧だけれど丁寧すぎない」言い方を1つ選んでください。\n答えは、次の形だけで書いてください（説明はいりません）。\n\n${FORMAT}\n\n日本語：${text}`;
}
function bulkPrompt(list){
  return `次の日本語を、それぞれ東南アジア出張（ホテル・タクシー・空港・お店）で使う、短い英語にしてください。\n「丁寧だけれど丁寧すぎない」言い方を1つずつ選んでください。\n答えは、1つずつ次の形で、あいだに空行を入れて書いてください（説明はいりません）。\n\n${FORMAT}\n\n` + list.map((m,i) => `${i+1}. ${m.text}`).join('\n');
}
function levelFrom(s){
  s = s || '';
  if(/丁寧すぎ/.test(s)) return 'polite';
  if(/くだけ|スラング|カジュアル/.test(s)) return 'casual';
  if(/教科書/.test(s)) return 'text';
  return 'just';
}
function parsePasted(text){
  const out = []; let cur = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/\*\*/g,'').replace(/^\s*[-・\d.)]+\s*/,'').trim();
    const m = line.match(/^(英語|日本語|丁寧さ|ひとこと)\s*[:：]\s*(.*)$/);
    if(!m) return;
    if(m[1] === '英語'){ cur = {en:m[2], ja:'', lv:'just', note:''}; out.push(cur); }
    else if(cur){
      if(m[1] === '日本語') cur.ja = m[2];
      if(m[1] === '丁寧さ') cur.lv = levelFrom(m[2]);
      if(m[1] === 'ひとこと') cur.note = m[2];
    }
  });
  return out.filter(p => p.en);
}

function earToggle(id, on){ earOpt.scenes = on ? earOpt.scenes.concat(id) : earOpt.scenes.filter(s => s !== id); }
async function earStart(){
  let list = earOpt.scenes.flatMap(id => phrasesOf(id));
  if(earOpt.onlyLearned) list = list.filter(p => prog(p.id).learned);
  if(!list.length){ toast('流す言い方がありません'); return; }
  earRunning = true;
  document.getElementById('earSetup').style.display = 'none';
  const b = document.getElementById('earBtn'); b.textContent = '■ 停止'; b.classList.remove('primary');
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  const run = {};  earRun = run;
  for(let k = 0; earRunning && earRun === run; k++){
    const p = list[k % list.length];
    const now = document.getElementById('earNow');
    if(now) now.innerHTML = `<div class="sub">${k % list.length + 1} / ${list.length}</div><div class="ja">${esc(p.ja)}</div><div class="sub">（英語で言ってみましょう）</div>`;
    await speak(p.ja, 'ja-JP', 1);
    if(!earRunning || earRun !== run) break;
    await wait(2500 + p.en.length * 60);
    for(let r = 0; r < earOpt.repeat && earRunning && earRun === run; r++){
      if(now) now.innerHTML = `<div class="sub">${k % list.length + 1} / ${list.length}</div><div class="ja">${esc(p.ja)}</div><div class="en">${esc(p.en)}</div>`;
      await speak(p.en);
      await wait(900);
    }
    await wait(800);
  }
}

  items.forEach((p, k) => store.custom.push({id:'c'+Date.now()+'_'+k, scene:sc, en:p.en, ja:p.ja, lv:p.lv, note:p.note}));
  // 貼り付けた日本語と同じ、または直前にChatGPTへ送ったメモは「済み」にする
  store.memos.forEach(m => { if(!m.done && (m.id === lastMemoId || items.some(p => p.ja && (p.ja.includes(m.text) || m.text.includes(p.ja))))) m.done = true; });
  lastMemoId = null;
  save(); toast(`${items.length}個の言い方を「${sceneOf(sc).name}」に追加しました`); memo();
}
function sceneAdd(){
  const name = document.getElementById('newSceneName').value.trim();
  if(!name){ toast('場面の名前を書いてください'); return; }
  const emoji = document.getElementById('newSceneEmoji').value.trim() || '📌';
  const s = {id:'s'+Date.now(), name, emoji};
  store.customScenes.push(s); if(earOpt.scenes) earOpt.scenes.push(s.id);
  save(); toast(`場面「${name}」を作りました`); memo(s.id);
}

// ===== 画面：言い方の編集 =====
function edit(id, back){
  stopAll();
  const p = findPhrase(id), g = prog(id), isCustom = id.startsWith('c');
  $app.innerHTML = header('言い方の編集', `scene('${back}')`) + `
    <div class="card">
      <label for="eEn">英語</label><input type="text" id="eEn" value="${esc(p.en)}">
      <label for="eJa">日本語</label><input type="text" id="eJa" value="${esc(p.ja)}">
      <label for="eLv">丁寧さ</label>
      <select id="eLv">${Object.entries(LEVELS).map(([k,L]) => `<option value="${k}" ${p.lv===k?'selected':''}>${L.label}</option>`).join('')}</select>
      <label for="eNote">ひとこと</label><input type="text" id="eNote" value="${esc(p.note || '')}">
      <label for="eScene">場面</label><select id="eScene">${sceneOptions(p.scene)}</select>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="eUsed" ${g.used ? 'checked' : ''}> ⭐ 本番で使えた！</label>
      <button class="btn primary wide" onclick="editSave('${id}','${back}')">保存</button>
    </div>
    <button class="btn wide" onclick="speak(document.getElementById('eEn').value)">🔊 読み上げてみる</button>
    <button class="btn wide" onclick="toChatGPT(askPrompt({en:document.getElementById('eEn').value, ja:document.getElementById('eJa').value}))">💬 ChatGPTに聞く</button>
    <button class="btn wide" onclick="resetProg('${id}','${back}')">練習の記録をはじめに戻す</button>
    <button class="btn wide" style="color:var(--ng)" onclick="editDel('${id}','${back}')">この言い方を削除</button>
    ${isCustom ? '' : '<div class="sub">最初から入っている言い方です。削除すると一覧に出なくなります。</div>'}`;
}
function editSave(id, back){
  const v = {en:eEn.value.trim(), ja:eJa.value.trim(), lv:eLv.value, note:eNote.value.trim(), scene:eScene.value};
  if(!v.en){ toast('英語を入れてください'); return; }
  if(id.startsWith('c')) Object.assign(store.custom.find(p => p.id === id), v);
  else store.edits[id] = v;
  prog(id).used = eUsed.checked;
  save(); toast('保存しました'); scene(back);
}
function resetProg(id, back){ if(!confirm('この言い方の「まねした回数・覚えた・言えた」を消しますか？')) return; store.progress[id] = {m:0, learned:false, said:false, used:prog(id).used}; save(); edit(id, back); }
function editDel(id, back){
  if(!confirm('この言い方を削除しますか？')) return;
  if(id.startsWith('c')) store.custom = store.custom.filter(p => p.id !== id);
  else store.hidden.push(id);
  delete store.progress[id];
  save(); toast('削除しました'); scene(back);
}

// ===== 画面：バックアップ・設定 =====
function settings(){
  stopAll();
  $app.innerHTML = header('⚙ バックアップ・設定', 'home()') + `
    <h2>お手本の英語の速さ</h2>
    <select onchange="store.rate=+this.value; save(); speak('Could you call a taxi for me?')">
      ${[[0.7,'ゆっくり'],[0.9,'少しゆっくり'],[1,'ふつう']].map(([v,l]) => `<option value="${v}" ${store.rate===v?'selected':''}>${l}</option>`).join('')}
    </select>
    <h2>バックアップ</h2>
    <div class="sub">練習の記録・自分で足した言い方・メモは、このスマホの中だけに保存されています。ときどきバックアップを保存しておくと安心です。</div>
    <button class="btn primary wide" onclick="backupSave()">💾 バックアップを保存</button>
    <label for="restore" class="btn wide" style="text-align:center;font-weight:normal">📂 バックアップから戻す</label>
    <input type="file" id="restore" accept=".json,application/json" style="display:none" onchange="backupLoad(this)">
    <h2>このアプリについて</h2>
    <div class="sub">見た目は仮です。発音チェックはスマホの音声認識を使います（インターネットが必要です）。</div>`;
}
function backupSave(){
  const d = new Date(), name = `出張英会話_バックアップ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const blob = new Blob([JSON.stringify(store, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('バックアップを保存しました（ダウンロードの中）');
}
function backupLoad(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!s || !s.progress) throw 0;
      if(!confirm('今の記録を、このバックアップの内容に置きかえますか？')) return;
      store = Object.assign(emptyStore(), s); save(); toast('バックアップから戻しました'); home();
    }catch(e){ toast('このファイルは読み込めませんでした'); }
  };
  r.readAsText(f);
}

home();
</script>
